name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install "jsonschema>=4.18" "pyyaml>=6" ruff
      - name: Check the index
        run: python -m checks.index
      - name: Lint the checks
        run: |
          ruff check .
          ruff format --check .
          python checks/style_check.py checks
      - name: Doctests
        run: python -m doctest checks/model.py checks/plugins.py checks/credentials.py checks/index.py
