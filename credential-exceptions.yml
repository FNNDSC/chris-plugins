# Parameters whose name reads as a credential (password, token, secret, key)
# but whose value is not one. Everything else so named must be empty.

- plugin: pl-dicom_headeredit
  parameter: splitKeyValue
  reason: the delimiter between a tag and its value
- plugin: pl-dicom_headeredit
  parameter: splitToken
  reason: the delimiter between tag edits
- plugin: pl-lld_chxr
  parameter: splitKeyValue
  reason: the character that splits a key from its value
- plugin: pl-lld_chxr
  parameter: splitToken
  reason: the token that splits the input tags
- plugin: pl-pfdicom_tagSub
  parameter: splitKeyValue
  reason: the delimiter between a tag and its value
- plugin: pl-pfdicom_tagSub
  parameter: splitToken
  reason: the delimiter between tag edits
- plugin: pl-superlink
  parameter: bastion_key
  reason: the path of a key file inside the container, not the key
